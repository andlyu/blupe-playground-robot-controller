[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blupe-playground-robot-controller"
version = "0.2.0.dev0"
description = "Local robot controller for BluPe Playground"
readme = "README.md"
requires-python = ">=3.10,<3.13"

[project.scripts]
blupe-controller = "blupe_controller.cli:main"

[project.optional-dependencies]
video = ["Pillow>=10,<13", "numpy>=2,<3", "huggingface-hub>=0.34,<2", "datasets>=3,<5"]
makerarm = ["opencv-python>=4.10,<5", "websockets>=14,<17"]
so101 = ["lerobot==0.5.1", "opencv-python>=4.10,<5", "websockets>=14,<17"]
yam = ["numpy==2.2.6", "mujoco==3.11.0", "ruckig==0.15.3", "opencv-python-headless==5.0.0.93", "websockets==16.1.1", "cryptography==48.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["blupe_controller*"]

[tool.setuptools.package-data]
blupe_controller = ["templates/*.html","runtime/assets/**/*", "runtime/config/*.json", "runtime/deploy/operator/*.json"]
